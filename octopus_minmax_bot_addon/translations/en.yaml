---
configuration:
  TEST_PLAYWRIGHT:
    name: Test Playwright
    description: Check Go, Agile and Cosy signup forms once at startup without submitting a switch. Disables comparisons and scheduling until restarted with this option off.
  OCTOPUS_LOGIN_EMAIL:
    name: Octopus Login Email
    description: Octopus website email used when API tariff initiation fails.
  OCTOPUS_LOGIN_PASSWD:
    name: Octopus Login Password
    description: Octopus website password used when API tariff initiation fails.
  ONE_OFF:
    name: One Off Execution
    description: Run the comparison ONCE then quit.
  NOTIFICATION_URLS:
    name: Notification URLs
    description: URLs to send notifications to. Using Apprise.
  EXECUTION_TIME:
    name: Execution Time
    description: When not One Off. This is the time to execute comparison.
  SWITCH_THRESHOLD:
    name: Switch Threshold
    description: A value (in pence) which the saving must be before the switch occurs. Default is 2 (2p).
  API_KEY:
    name: API Key
    description: Octopus API Key
  ACC_NUMBER:
    name: Account Number
    description: Enter Octopus Account Number
  DRY_RUN:
    name: Dry Run
    description: Compare tariffs but don't initiate any switches.
  TARIFFS:
    name: Tariffs
    description: Tariffs you want to compare with. See README.md for options.
  TZ:
    name: Timezone
    description: Timezone for container
  BATCH_NOTIFICATIONS:
    name: Batch Notifications
    description: An optional flag to send messages in one batch rather than individually
