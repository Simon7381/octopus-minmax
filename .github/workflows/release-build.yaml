name: Build and Push Docker Image on Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v2.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag }}
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Validate release version and set Docker image
        shell: bash
        run: |
          if [[ -z "${DOCKER_IMAGE//[[:space:]]/}" ]]; then
            echo "::error::Set the DOCKER_IMAGE repository variable to your Docker Hub namespace/image (without a tag)."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag must be a valid Docker tag."
            exit 1
          fi
          image="${DOCKER_IMAGE,,}"
          echo "DOCKER_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Resolve latest stable Playwright Noble image
        id: playwright
        run: python scripts/build_image.py --resolve-only --github-output

      - name: Update version in config.py
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("src/config.py")
          content, count = re.subn(
              r'^BOT_VERSION = .*$',
              lambda _: "BOT_VERSION = " + json.dumps(os.environ["VERSION"]),
              path.read_text(encoding="utf-8"),
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Expected exactly one BOT_VERSION assignment")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          build-args: PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }}
          no-cache: true
          pull: true
          load: true
          platforms: linux/amd64
          tags: octopus-minmax:test

      - name: Run offline tests before publishing
        run: docker run --rm octopus-minmax:test python -m unittest discover -s tests -v

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          build-args: PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }}
          # Resolve the latest dependencies on every release build.
          no-cache: true
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}

  update-addon:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Update add-on configuration and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          # Read the workflow variable directly: job outputs can be suppressed
          # when the image namespace also matches the Docker username secret.
          image = os.environ.get("DOCKER_IMAGE", "").strip().lower()
          if not image:
              raise SystemExit("Set the DOCKER_IMAGE repository variable before updating the add-on")
          addon = Path("octopus_minmax_bot_addon")
          path = addon / "config.yaml"
          content = path.read_text(encoding="utf-8")
          for key, value in (("version", version), ("image", image)):
              content, count = re.subn(
                  rf"^{key}:.*$", lambda _: f"{key}: {value}",
                  content, flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} in add-on config")
          path = addon / "CHANGELOG.md"
          changelog = path.read_text(encoding="utf-8")
          # Release headings are distinct from subheadings such as What's Changed.
          headings = list(re.finditer(
              r"^## (?P<version>v?\d[^\s]*)[^\n]*$", changelog, re.MULTILINE,
          ))
          current = next((h for h in headings if h["version"] == version), None)
          start = current.start() if current else 0
          end = next((h.start() for h in headings if h.start() > start), len(changelog)) if current else 0
          existing_notes = changelog[current.end():end].strip() if current else ""
          # Old fallback text and link-only entries are not completed release notes.
          placeholder = re.fullmatch(
              r"(?:No release notes were provided\.\s*)?"
              r"\*\*(?:Full Changelog|Release details)\*\*: https://github\.com/\S+",
              existing_notes,
          )
          # Preserve substantive entries, but repair empty entries and placeholders.
          if not existing_notes or placeholder:
              release = json.loads(subprocess.check_output([
                  "gh", "release", "view", version,
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--json", "name,body",
              ], text=True, encoding="utf-8"))
              title = release["name"] or version
              notes = (release["body"] or "").strip()
              if not notes:
                  previous = next((h["version"] for h in headings if h.start() >= end and h["version"] != version), None)
                  command = [
                      "gh", "api", "--method", "POST",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/generate-notes",
                      "-f", f"tag_name={version}",
                  ]
                  if previous:
                      command.extend(["-f", f"previous_tag_name={previous}"])
                  print(f"Release body is empty; generating notes for {version} from {previous or 'automatic previous tag'}.")
                  generated = json.loads(subprocess.check_output(command, text=True, encoding="utf-8"))
                  notes = (generated.get("body") or "").strip()
                  if not notes:
                      raise SystemExit("GitHub returned empty generated release notes; add a release description and rerun.")
              else:
                  print(f"Using published release notes for {version}.")
              entry = f"## {version} - {title}\n{notes}\n\n"
              changelog = changelog[:start] + entry + changelog[end:]
          else:
              print(f"Preserving existing release notes for {version}.")

          # Resolve and validate all metadata before changing any files.
          (addon / "config.yaml").write_text(content, encoding="utf-8")
          shutil.copyfile("README.md", addon / "README.md")
          path.write_text(changelog, encoding="utf-8")
          PY

      # Repository Settings > Actions > General must allow Actions to create PRs.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Update Addon Configuration to ${{ env.VERSION }}"
          body: "Updates the add-on image and version after a successful release build, and synchronizes README and CHANGELOG."
          commit-message: "Update add-on configuration to ${{ env.VERSION }}"
          base: ${{ github.event.repository.default_branch }}
          branch: update-addon-config-${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            octopus_minmax_bot_addon/config.yaml
            octopus_minmax_bot_addon/README.md
            octopus_minmax_bot_addon/CHANGELOG.md
