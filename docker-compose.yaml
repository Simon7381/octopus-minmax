version: "3.8"

services:
  minmax_octopus_bot:
    container_name: MinMaxOctopusBot
    image: eelmafia/octopus-minmax-bot
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./logs:/app/logs
    environment:
      - TZ=Europe/London
      - ACC_NUMBER=<your_account_number>
      - API_KEY=<your_api_key>
      - OCTOPUS_LOGIN_EMAIL=${OCTOPUS_LOGIN_EMAIL:-}
      - OCTOPUS_LOGIN_PASSWD=${OCTOPUS_LOGIN_PASSWD:-}
      - EXECUTION_TIME=23:30
      - SWITCH_THRESHOLD=2
      - NOTIFICATION_URLS=<your_apprise_notification_urls>
      - ONE_OFF=false
      - DRY_RUN=false
      - TEST_PLAYWRIGHT=false
      - TARIFFS=agile,flexible
      - WEB_USERNAME=admin
      - WEB_PASSWORD=admin # not meant to be secure
